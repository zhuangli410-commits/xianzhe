<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闲着 · 逐项批注</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#111116;color:#f6f4ff}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:28px}header{display:flex;align-items:end;justify-content:space-between;gap:18px}h1{font-size:32px;margin:0}p{color:#aaa8bb;line-height:1.65}.pill{background:#292334;color:#c9bbff;padding:9px 14px;border-radius:999px;font-size:13px;white-space:nowrap}nav{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}button{background:#292832;color:#eee;border:1px solid #464450;padding:10px 16px;border-radius:12px;font:inherit;cursor:pointer}button.active,button:hover{background:#af9dff;color:#17121d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.stage{position:relative;align-self:start;border:1px solid #3b3948;border-radius:18px;overflow:hidden;background:#18171e}.stage img{display:block;width:100%}.zone{position:absolute;border:2px solid transparent;background:transparent;border-radius:8px;cursor:pointer}.zone:hover,.zone.active{border-color:#c5b5ff;background:#ac90ff2a}.zone::after{content:attr(data-label);position:absolute;left:5px;top:5px;background:#aa99ef;color:#17131e;border-radius:6px;padding:3px 6px;font-size:11px;white-space:nowrap;opacity:0}.zone:hover::after,.zone.active::after{opacity:1}.panel{position:sticky;top:20px;height:fit-content;background:#222129;border:1px solid #3f3b4b;border-radius:18px;padding:20px}.small{font-size:13px;color:#aaa8bb}.list{display:flex;flex-wrap:wrap;gap:7px}.list button{font-size:12px;padding:7px 9px}.list button.active{background:#ac9bff;color:#17121e}h2{font-size:22px;margin:20px 0 6px}textarea{display:block;width:100%;min-height:160px;resize:vertical;background:#121116;color:#fff;border:1px solid #5a526e;border-radius:11px;font:15px/1.6 inherit;padding:12px;outline:none}textarea:focus{border-color:#b9a8ff}.save{margin-top:10px;color:#9ad5bd;font-size:13px}.callout{margin-top:20px;background:#1e1b26;border-left:3px solid #b5a3ff;padding:12px 15px;border-radius:8px}.callout strong{color:#e5dcff}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}.shell{padding:16px}}
</style></head><body><main class="shell"><header><div><h1>闲着 · 逐项批注</h1><p>在左侧画面点一块，然后在右侧直接写意见。内容会自动保存到这台 Mac，我下次可以按位置逐条修改。</p></div><span class="pill">正式版 · 1.0</span></header><nav id="tabs"></nav><div class="layout"><div class="stage" id="stage"><img id="shot" alt="界面预览"></div><aside class="panel"><div class="small" id="status"></div><div class="list" id="parts"></div><h2 id="partName"></h2><p id="hint"></p><label for="comment" class="small">你的批注</label><textarea id="comment" placeholder="例如：这里文字太小，按钮换个位置，阴影再柔和一点……"></textarea><div class="save" id="save">尚未输入</div><p class="small">批注保存在本机，不会传到 GitHub。可以逐块写，不必一次写完。</p></aside></div><div class="callout"><strong>当前进度：</strong>摄影棚已加入三维布光；可拖动调向的手电筒、循环昼夜和会燃尽的火焰在本机预览。长时、高压力和跨机型体验仍需检查。</div></main><script>
const pages=[
{name:'主界面',image:'闲着-1.0-主界面.png',parts:[['header','顶部标题与版本',3,3,94,11,'看标题、说明和版本标记的大小与对齐。'],['preview','模拟桌面',3,17,62,42,'看图标位置、背景和操作感。'],['appearance','图标外观控制',66,17,31,42,'看大小、速度、抠图和入口按钮。'],['color','图标配色',3,60,94,12,'看颜色识别、一键换色与文字。'],['stats','电脑状态',3,74,94,11,'看芯片、内存数字是否清楚。'],['runtime','实时绘制',3,86,94,7,'看性能模式、采样档位和状态说明。'],['footer','底部操作',3,93,94,7,'看显示开关、暂停与退出。']]},
{name:'摄影棚',image:'闲着-1.0-摄影棚.png',parts:[['object','立体图标',5,7,90,61,'看图标精细度、侧边与旋转效果。'],['shadow','灯光和阴影',5,7,90,61,'看灯色、投影位置、软硬和层次。'],['light','灯光控制',3,70,94,9,'看亮度、灯色与手动调光。'],['perf','画质与强度',3,78,94,7,'看自动画质、GPU 耗时和光影采样说明。'],['material','材质与厚度',3,85,94,15,'看金属、厚度、上下翻转与视角控制。']]},
{name:'三维布光台',image:'闲着-1.0-三维布光.png',parts:[['space','三维空间与网格',3,18,58,54,'看空间是否容易理解、图标与灯具是否好分辨。'],['drag','灯具位置和拖动',10,36,37,30,'点选、拖动平面位置；按 Option 拖动高度是否顺手。'],['list','多灯选择和添加',62,23,34,16,'看选灯、添加灯具和数量限制是否清楚。'],['type','灯具类型与调向',62,39,34,12,'看灯具选择、开关，以及按住调向时手电筒光束是否随朝向改变。'],['sliders','位置与亮度',62,51,34,22,'看左右、前后、高度和亮度的数值与手感。'],['color','光色与删除',62,73,34,9,'看灯色设置和删除辅助灯是否明确。'],['model','模型显示与性能信息',3,73,94,14,'看一键隐藏模型以及绘制负担的说明。']]},
{name:'灯具模型',image:'闲着-1.0-灯具模型.png',parts:[['studio','摄影灯',3,5,23,43,'这是放大的模型细节预览；看灯箱、发光面和支架。实际布光台显示更小。'],['flashlight','手电筒',27,5,23,43,'看筒身、握持纹理、灯头和透镜是否像真实物件。'],['sun','太阳',52,5,23,43,'看光球和放射结构是否舒服。'],['lighter','打火机',76,5,23,43,'看机身、金属顶盖、火轮和火焰。'],['candle','蜡烛',3,52,23,43,'看蜡体、灯芯和火焰。'],['match','火柴',27,52,23,43,'看木杆、火柴头和火焰。'],['moon','月亮',52,52,23,43,'看夜间月亮的模型和颜色。']]},
{name:'昼夜布光预览',image:'闲着-1.0-昼夜布光.png',parts:[['sky','月亮与夜间光',3,18,58,54,'看太阳落下后月亮的模型、位置和较暗的冷色光。'],['time','时间操作',3,79,58,9,'看跳到夜晚和四分钟演示周期是否清楚。'],['lights','多灯控制',62,18,34,52,'看太阳和其他灯同场时的选择、开关、亮度与说明。']]},
{name:'调光板',image:'闲着-0.6.2-调光板.png',parts:[['pad','光点拖动区',5,23,90,35,'简易调光板用于主灯；多灯和朝向在摄影棚的三维布光页调整。'],['sliders','四个滑杆',5,56,90,33,'看左右、上下、远近、亮度及实时数值。'],['preset','灯色和重置',5,89,90,10,'看预设灯色和重置。']]}
];let page=0,part=0,store={};const $=id=>document.getElementById(id);let timer;async function load(){try{store=await(await fetch('/api/comments')).json()}catch{store={}}render()}function key(){return pages[page].name+'/'+pages[page].parts[part][0]}function render(){const p=pages[page],z=p.parts[part];$('tabs').innerHTML='';pages.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x.name;b.className=i===page?'active':'';b.onclick=()=>{page=i;part=0;render()};$('tabs').append(b)});$('shot').src=p.image;$('stage').querySelectorAll('.zone').forEach(x=>x.remove());$('parts').innerHTML='';p.parts.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[1];b.className=i===part?'active':'';b.onclick=()=>{part=i;render()};$('parts').append(b);let a=document.createElement('button');a.className='zone'+(i===part?' active':'');a.dataset.label=x[1];a.style.left=x[2]+'%';a.style.top=x[3]+'%';a.style.width=x[4]+'%';a.style.height=x[5]+'%';a.title=x[1];a.onclick=b.onclick;$('stage').append(a)});$('partName').textContent=z[1];$('hint').textContent=z[6];$('status').textContent='当前：'+p.name+' / '+z[1];$('comment').value=store[key()]||'';$('save').textContent=store[key()]?'已保存的批注':'尚未输入'}$('comment').addEventListener('input',()=>{const k=key();store[k]=$('comment').value;$('save').textContent='正在保存…';clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(store)});if(!r.ok)throw Error();$('save').textContent='已保存到这台 Mac'}catch{$('save').textContent='保存失败，请保持页面并重试输入'}},300)});load();
</script></body></html>
